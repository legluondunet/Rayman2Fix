              (Get-FileHash build/Release/fix.dll -Algorithm SHA256).Hash) {
            throw 'Learn10 launcher must embed the exact research DLL'
          }
          $global:LASTEXITCODE = 0
      - name: Upload Learn_10 read-only research launcher
        uses: actions/upload-artifact@v4
        with:
          name: Rayman2Fix-Windows-x86-learn10-trace
          path: learn10-trace/
          if-no-files-found: error
          retention-days: 14

      - name: Build strictly opt-in Learn_10 native NOMOVIES prototype
        shell: pwsh
        run: |
          # This EXPERIMENTAL build differs from the passive learn10-trace:
          # with a second runtime environment opt-in it may TEMPORARILY
          # change the game progress bit 1188. Never ship as standard.
          # Only the original game AI executes the alternate scene branch.
          cmake -S . -B build -A Win32 -DBUILD_TESTING=OFF -DRAYMAN2FIX_RESEARCH_PROBES=ON -DRAYMAN2FIX_LEARN10_NOMOVIES_PROTO=ON -DRAYMAN2FIX_AUDIO_TRACE=OFF -DRAYMAN2FIX_ESC_MUSIC_PROTO=OFF
          if ($LASTEXITCODE -ne 0) { throw 'Learn10 native prototype configure failed' }
          cmake --build build --config Release --target Rayman2Fix --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Learn10 native prototype build failed' }
          @'
          from pathlib import Path
          data=Path('build/Release/fix.dll').read_bytes()
          for marker in (
