  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test pinned GameFrame limiter source integration
        run: python3 -m unittest discover -s tests -p 'test_fps_limit_patch.py'
      - name: Check strict optional external intro logo patch
        run: python3 -m unittest discover -s tests -p 'test_intro_logo_hd_patch.py'
      - name: Verify RayWiki 403 browser-download fallback
        run: python3 -m unittest discover -s tests -p 'test_prepare_intro_logo_hd.py'
      - name: Verify Learn_10 safe fallback
        run: python3 -m unittest discover -s tests -p 'test_learn10_readonly.py'
      - name: Verify Learn_10 NOMOVIES trace auditor (fail closed, synthetic sessions)
        run: python3 -m unittest discover -s tests -p 'test_learn10_trace_validator.py'
      - name: Verify Learn_10 read-only save inventory (synthetic fixtures)
        run: python3 -m unittest discover -s tests -p 'test_learn10_save_audit.py'
      - name: Check Wine save-reload test Bash syntax
        run: bash -n tools/rayman2fix_test_wine_save_reload.sh
      - name: Verify audio research trace stays out of normal builds
        run: python3 -m unittest discover -s tests -p 'test_audio_trace_guards.py'
      - name: Verify standalone PE32 audio inspector with synthetic fixtures
        run: python3 -m unittest discover -s tests -p 'test_audio_static_inspector.py'
      - name: Verify offline owner-scoped audio trace evidence parser
        run: python3 -m unittest discover -s tests -p 'test_audio_trace_evidence.py'
      - name: Verify native sound bank inverse lookup fails closed on uncertain data
        run: python3 -m unittest discover -s tests -p 'test_audio_bank_origin_model.py'
      - name: Verify original-CD audio parity parser with synthetic PE files
        run: python3 -m unittest discover -s tests -p 'test_audio_cd_parity.py'
      - name: Verify dual Theme and SXD native pause routing with synthetic model
        run: python3 -m unittest discover -s tests -p 'test_audio_dual_dispatch_model.py'
      - name: Verify SHA-pinned original CD Theme-11 dual routing with synthetic PE
        run: python3 -m unittest discover -s tests -p 'test_original_cd_dual_pause_routes.py'
      - name: Verify retail CD GLI cinematic frame-flip wrapper with synthetic PE
        run: python3 -m unittest discover -s tests -p 'test_original_cd_frame_flip.py'
      - name: Check minimal native ESC music model and mandatory nested-pause counterexample
        run: python3 -m unittest discover -s tests -p 'test_esc_music_record_experiment.py'
      - name: Verify ESC music shadow reconciler with 4096 mixed native pause sequences
        run: python3 -m unittest discover -s tests -p 'test_esc_music_shadow_reconciler.py'
      - name: Verify native audio pause invariants against synthetic model
        run: python3 -m unittest discover -s tests -p 'test_audio_pause_invariants.py'
      - name: Verify offline BNM candidate metadata with synthetic banks
        run: python3 -m unittest discover -s tests -p 'test_audio_bnm_inspector.py'
      - name: Verify proposed ESC Theme focus-policy invariants
        run: python3 -m unittest discover -s tests -p 'test_audio_pause_policy_model.py'
      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Verify Linux bootstrap workspace
        run: |
          result=0
          ./build/rayman2fix_cli || result=$?
          test "$result" -eq 2
          test -f build/Rayman2Fix.ini
          test -f build/Rayman2Fix_installer.log
          test ! -e build/Rayman2Fix.log
          grep -q 'SYS-INFO: END' build/Rayman2Fix_installer.log
          test "$(grep -v '^;' build/Rayman2Fix.ini | sed '/^$/d')" = "$(printf '[Debug]\nLog=1\n[Graphics]\nFPSLimit=60\nAspectRatio=Auto\n[Features]\nSkipCinematics=1\nRemoveDialogueBackgrounds=1\nRemoveCinematicBars=1\nMusicInPauseMenu=1')" || exit 1
          printf 'old game log\n' > build/Rayman2Fix.log
          printf '[Debug]\r\nLog=0\r\n' > build/Rayman2Fix.ini
          result=0
          ./build/rayman2fix_cli || result=$?
          test "$result" -eq 2
          test ! -e build/Rayman2Fix.log
          test ! -e build/Rayman2Fix_installer.log
          printf '[Debug]\r\nLog=1\r\n' > build/Rayman2Fix.ini
          result=0
          ./build/rayman2fix_cli || result=$?
          test "$result" -eq 2
          test ! -e build/Rayman2Fix.log
          grep -q 'CONFIG: Debug.Log=1' build/Rayman2Fix_installer.log
