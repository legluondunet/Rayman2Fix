name: Build Rayman2Fix bootstrap

on:
  push:
    branches: [ main, feat/bootstrap-cd-images ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x86:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure 32-bit Windows
        run: cmake -S . -B build -A Win32 -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Verify launcher workspace and diagnostics
        shell: pwsh
        run: |
          & ./build/Release/Rayman2Fix.exe --init
          if ($LASTEXITCODE -ne 0) { throw "Rayman2Fix --init failed" }
          if (!(Test-Path build/Release/Rayman2Fix/Rayman2Fix.ini)) {
            throw "Expected persistent Rayman2Fix.ini alongside launcher"
          }
          if (!(Test-Path build/Release/Rayman2Fix.log)) {
            throw "Expected single launcher-side log"
          }
          if (!(Select-String -Path build/Release/Rayman2Fix.log -Pattern 'SYS-OS:')) {
            throw "Expected system inventory in the launcher log"
          }
      - name: Stage launcher and private runtime directory
        shell: pwsh
        run: |
          New-Item -Path package/Rayman2Fix -ItemType Directory -Force | Out-Null
          Copy-Item build/Release/Rayman2Fix.exe package/Rayman2Fix.exe
          Copy-Item build/Release/Rayman2Fix.dll package/Rayman2Fix/Rayman2Fix.dll
          Copy-Item assets/Rayman2Fix.ini package/Rayman2Fix/Rayman2Fix.ini
          if (!(Test-Path package/Rayman2Fix.exe) -or
              !(Test-Path package/Rayman2Fix/Rayman2Fix.dll) -or
              !(Test-Path package/Rayman2Fix/Rayman2Fix.ini)) {
            throw 'Incomplete Rayman2Fix bootstrap package'
          }
      - name: Upload bootstrap package
        uses: actions/upload-artifact@v4
        with:
          name: Rayman2Fix-Windows-x86-bootstrap
          path: package/
          if-no-files-found: error
          retention-days: 30

  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Verify Linux bootstrap workspace
        run: |
          ./build/rayman2fix_cli --init
          test -f build/Rayman2Fix/Rayman2Fix.ini
          test -f build/Rayman2Fix.log
          grep -q 'SYS-INFO: END' build/Rayman2Fix.log
