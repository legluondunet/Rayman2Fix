              b'phase=native-gate-snapshot',
              b'max-exposure-5000ms',
              b'RUNTIME-INTRO: native-early-exit-shape',
          ):
              if marker not in data:
                  raise SystemExit(f'Native Learn10 prototype DLL missing marker: {marker!r}')
          if b'RUNTIME-AUDIO-TRACE: enabled=1' in data:
              raise SystemExit('Native Learn10 prototype unexpectedly contains audio research')
          print('Experimental only + explicit environment opt in: PASS')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Native Learn10 prototype fingerprint failed' }
          New-Item -Path learn10-nomovies -ItemType Directory -Force | Out-Null
          Copy-Item build/Release/Rayman2Fix.exe learn10-nomovies/Rayman2Fix.exe
          New-Item -Path learn10-nomovies-smoke -ItemType Directory -Force | Out-Null
          Copy-Item learn10-nomovies/Rayman2Fix.exe learn10-nomovies-smoke/Rayman2Fix.exe
          & ./learn10-nomovies-smoke/Rayman2Fix.exe --verify 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 2) { throw 'Prototype must fail safely without retail CD' }
          $deployed='learn10-nomovies-smoke/game/fix.dll'
