          Copy-Item build/Release/Rayman2Fix.exe learn10-trace/Rayman2Fix.exe
          New-Item -Path learn10-smoke -ItemType Directory -Force | Out-Null
          Copy-Item learn10-trace/Rayman2Fix.exe learn10-smoke/Rayman2Fix.exe
          & ./learn10-smoke/Rayman2Fix.exe --verify 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 2) { throw 'No-media Learn10 trace must fail safely' }
          $deployed='learn10-smoke/game/fix.dll'
          if (!(Test-Path $deployed) -or
