          }
          $global:LASTEXITCODE = 0
      - name: Upload strictly opt-in Learn_10 native NOMOVIES prototype
        uses: actions/upload-artifact@v4
        with:
          name: Rayman2Fix-Windows-x86-learn10-nomovies-PROTOTYPE
          path: learn10-nomovies/
          if-no-files-found: error
          retention-days: 14

      - name: Build isolated Learn_10 script-keyword research candidate (no artifact)
        shell: pwsh
        run: |
          # This is NOT a tested or released fix. Never write story bit 1188.
          # Keep the proven bit-writing prototype artifact separate.
          cmake -S . -B build -A Win32 -DBUILD_TESTING=OFF -DRAYMAN2FIX_RESEARCH_PROBES=ON -DRAYMAN2FIX_LEARN10_NOMOVIES_PROTO=OFF -DRAYMAN2FIX_LEARN10_SCRIPT_GATE_PROTO=ON -DRAYMAN2FIX_AUDIO_TRACE=OFF -DRAYMAN2FIX_ESC_MUSIC_PROTO=OFF
