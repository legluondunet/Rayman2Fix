name: Build Rayman2Fix bootstrap

on:
  push:
    branches: [ main, feat/bootstrap-cd-images ]
  pull_request:
    # The NOMOVIES draft is stacked on the passive Learn_10 research PR.
    branches: [ main, research/learn10-native-exit-probe, experiment/learn10-native-nomovies ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x86:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned Apache 2.0 GameFrame
        uses: actions/checkout@v4
        with:
          repository: tanepiper/game-frame
          ref: f195a074a63cc150673c38becdec696163b0b3d1
          path: third_party/game-frame
          persist-credentials: false
      - name: Install Rust Windows x86 toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc
      - name: Build pinned GameFrame 32-bit glide2x.dll
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = (Resolve-Path 'third_party/game-frame/wrappers/Cargo.toml').Path
          $upstreamDef = (Resolve-Path 'third_party/game-frame/wrappers/glide/glide2x.def').Path
          # Adapt GNU internal symbols to 32-bit MSVC, keep 156 public exports.
          $def = Join-Path $env:RUNNER_TEMP 'rayman2fix-glide-msvc.def'
          $original = (Get-Content -Raw $upstreamDef).Replace([string][char]13, '')
          $converted = [regex]::Replace($original, '(?m)^(_[A-Za-z0-9_]+@[0-9]+)=([A-Za-z0-9_]+@[0-9]+)$', '$1=_$2')
          $count = ([regex]::Matches($converted, '(?m)^_[A-Za-z0-9_]+@[0-9]+=_[A-Za-z0-9_]+@[0-9]+$')).Count
          if ($count -ne 156) { throw "Expected 156 Glide exports, got $count" }
          Set-Content -Path $def -Value $converted -Encoding ascii
          python tools/gameframe/apply_fps_limit.py third_party/game-frame
          if ($LASTEXITCODE -ne 0) { throw 'Pinned GameFrame FPS patch failed' }
          python tools/gameframe/apply_render_probe.py third_party/game-frame
          if ($LASTEXITCODE -ne 0) { throw 'Pinned GameFrame color-path diagnostic patch failed' }
          python tools/gameframe/apply_loading_image_fix.py third_party/game-frame
          if ($LASTEXITCODE -ne 0) { throw 'Pinned GameFrame loading image correction failed' }
          python tools/gameframe/apply_intro_logo_hd.py third_party/game-frame
          if ($LASTEXITCODE -ne 0) { throw 'Pinned GameFrame external logo override patch failed' }
          $env:RUSTFLAGS = "-C link-arg=/DEF:$def"
          cargo build -p glide --release --target i686-pc-windows-msvc --manifest-path $manifest
          if ($LASTEXITCODE -ne 0) { throw 'GameFrame x86 compilation failed' }
      - name: Audit GameFrame 32-bit Glide export ABI
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pefile
          if ($LASTEXITCODE -ne 0) { throw 'PE auditor dependency failed' }
          $dll = 'third_party/game-frame/wrappers/target/i686-pc-windows-msvc/release/glide2x.dll'
          python tools/gameframe/audit_exports.py $dll third_party/game-frame/wrappers/glide/glide2x.def
          if ($LASTEXITCODE -ne 0) { throw 'GameFrame ABI audit failed' }
          $sha = (Get-FileHash $dll -Algorithm SHA256).Hash.ToLowerInvariant()
          "RAYMAN2FIX_GAMEFRAME_SHA256=$sha" >> $env:GITHUB_ENV
          Write-Host "Pinned GameFrame x86 SHA256=$sha"
      - name: Configure 32-bit Windows with embedded GameFrame
        shell: pwsh
        run: |
          $dll = (Resolve-Path 'third_party/game-frame/wrappers/target/i686-pc-windows-msvc/release/glide2x.dll').Path
          $license = (Resolve-Path 'third_party/game-frame/LICENSE-APACHE').Path
          cmake -S . -B build -A Win32 -DBUILD_TESTING=ON "-DRAYMAN2FIX_GLIDE_DLL=$dll" "-DRAYMAN2FIX_GLIDE_LICENSE=$license" "-DRAYMAN2FIX_GLIDE_SHA256=$env:RAYMAN2FIX_GAMEFRAME_SHA256"
          if ($LASTEXITCODE -ne 0) { throw 'Launcher/GameFrame configure failed' }
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Verify launcher workspace and diagnostics
        shell: pwsh
        run: |
          # Bare execution is the default workflow. With no CD or installed
          # game the launcher must fail safely while still generating config/log.
          & ./build/Release/Rayman2Fix.exe
          if ($LASTEXITCODE -ne 2) { throw "Bare launcher must report missing CD" }
          & ./build/Release/Rayman2Fix.exe --init
          if ($LASTEXITCODE -ne 2) { throw "--init must no longer be supported" }
          if (!(Test-Path build/Release/Rayman2Fix.ini)) {
            throw "Expected root Rayman2Fix.ini in clean layout"
          }
          if (!(Test-Path build/Release/Rayman2Fix_installer.log) -or
              (Test-Path build/Release/Rayman2Fix.log)) {
            throw "Expected installer log only before game launch"
          }
          if (!(Select-String -Path build/Release/Rayman2Fix_installer.log -Pattern 'SYS-OS:')) {
            throw "Expected system inventory in the installer log"
          }
          # Do not keep lines from an earlier installer invocation.
          Add-Content -Path build/Release/Rayman2Fix_installer.log -Value 'STALE-INSTALLER-SESSION'
          & ./build/Release/Rayman2Fix.exe
          if ($LASTEXITCODE -ne 2 -or
              (Select-String -Path build/Release/Rayman2Fix_installer.log -SimpleMatch 'STALE-INSTALLER-SESSION') -or
              @(Select-String -Path build/Release/Rayman2Fix_installer.log -Pattern '^START: local_time=').Count -ne 1 -or
              !(Select-String -Path build/Release/Rayman2Fix_installer.log -Pattern '^RUNTIME-DEPLOY:')) {
            throw 'Installer log must contain exactly the latest launcher invocation'
          }
          # Optional HD logo must be diagnosed without accessing any
          # original game texture. Presence/header checks never claim a
          # successful GPU replacement; that proof belongs to GameFrame.
          $logo = 'build/Release/mods/textures/logo.rgba'
          if (!(Select-String -Path build/Release/Rayman2Fix_installer.log -Pattern 'MODS: intro_logo=missing ')) {
            throw 'Missing optional HD logo must be reported clearly'
          }
          [IO.File]::WriteAllText($logo, 'invalid', [Text.Encoding]::ASCII)
          & ./build/Release/Rayman2Fix.exe
          if ($LASTEXITCODE -ne 2 -or
              !(Select-String -Path build/Release/Rayman2Fix_installer.log -Pattern 'MODS: intro_logo=invalid-size ')) {
            throw 'Malformed optional HD logo size must not pass'
          }
          $bytes = New-Object byte[] (16 + 768 * 384 * 4)
          [Text.Encoding]::ASCII.GetBytes('R2LOGOHD').CopyTo($bytes, 0)
          [BitConverter]::GetBytes([uint32]768).CopyTo($bytes, 8)
          [BitConverter]::GetBytes([uint32]384).CopyTo($bytes, 12)
          [IO.File]::WriteAllBytes($logo, $bytes)
          & ./build/Release/Rayman2Fix.exe
          if ($LASTEXITCODE -ne 2 -or
              !(Select-String -Path build/Release/Rayman2Fix_installer.log -Pattern 'MODS: intro_logo=header-valid ')) {
            throw 'Canonical HD logo atlas header must be recognized'
          }
          $bytes[0] = [byte]0
          [IO.File]::WriteAllBytes($logo, $bytes)
          & ./build/Release/Rayman2Fix.exe
          if ($LASTEXITCODE -ne 2 -or
              !(Select-String -Path build/Release/Rayman2Fix_installer.log -Pattern 'MODS: intro_logo=invalid-header ')) {
            throw 'Incorrect HD atlas signature must be rejected'
          }
          Remove-Item $logo -Force
          $ini = 'build/Release/Rayman2Fix.ini'
          $initial = (Get-Content $ini | Where-Object {
            $_.Trim() -and !$_.Trim().StartsWith(';')
          })
          if ($initial.Count -ne 10 -or $initial[0] -ne '[Debug]' -or
              $initial[1] -ne 'Log=1' -or $initial[2] -ne '[Graphics]' -or
              $initial[3] -ne 'FPSLimit=60' -or
              $initial[4] -ne 'AspectRatio=Auto' -or
              $initial[5] -ne '[Features]' -or
              $initial[6] -ne 'SkipCinematics=1' -or
              $initial[7] -ne 'RemoveDialogueBackgrounds=1' -or
              $initial[8] -ne 'RemoveCinematicBars=1' -or
              $initial[9] -ne 'MusicInPauseMenu=1') {
            throw "Bootstrap INI must enable the four feature defaults and retain separate 4:3/dialogue/cinematic options"
          }
          # Win32 CRLF and UTF-8 BOM parsing plus both-log opt-out.
          [IO.File]::WriteAllText('build/Release/Rayman2Fix.log', 'old runtime', [Text.Encoding]::ASCII)
          [IO.File]::WriteAllText((Resolve-Path $ini), "[Debug]`r`nLog=0`r`n", [Text.UTF8Encoding]::new($true))
          & ./build/Release/Rayman2Fix.exe
          if ($LASTEXITCODE -ne 2 -or (Test-Path build/Release/Rayman2Fix_installer.log) -or
              (Test-Path build/Release/Rayman2Fix.log)) {
            throw "Log=0 must remove BOTH log files"
          }
          [IO.File]::WriteAllText((Resolve-Path $ini), "[Debug]`r`nLog=1`r`n", [Text.UTF8Encoding]::new($true))
          & ./build/Release/Rayman2Fix.exe
          if ($LASTEXITCODE -ne 2 -or !(Test-Path build/Release/Rayman2Fix_installer.log) -or
              (Test-Path build/Release/Rayman2Fix.log) -or
              !(Select-String -Path build/Release/Rayman2Fix_installer.log -Pattern 'CONFIG: Debug.Log=1')) {
            throw "Log=1 must create installer log without launching game"
          }
          # PowerShell propagates the last nonzero native exit code even
          # after all expected-error assertions have passed.
          $global:LASTEXITCODE = 0
      - name: Verify streamlined installer CLI and direct unchecked mode
        shell: pwsh
        run: |
          $exe = './build/Release/Rayman2Fix.exe'
          $help = (& $exe --help | Out-String)
          if ($LASTEXITCODE -ne 0 -or !$help.Contains('--install-only') -or
              !$help.Contains('--launch-no-verify') -or
              !$help.Contains('--verbose') -or !$help.Contains('--inspect') -or
              !$help.Contains('-h') -or $help.Contains('--extract')) {
            throw 'Help must show only supported installer commands'
          }
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw '--version failed' }
          & $exe --inspect test.iso
          if ($LASTEXITCODE -ne 2) { throw 'Missing/unsupported ISO must fail with a log' }
          if (!(Test-Path build/Release/Rayman2Fix_inspect.log) -or
              !(Select-String -Path build/Release/Rayman2Fix_inspect.log -Pattern 'INSPECT_RESULT=FAILED')) {
            throw 'Inspect must create a separate failure report'
          }
          # A second --inspect must truncate its own report, not append.
          Add-Content -Path build/Release/Rayman2Fix_inspect.log -Value 'STALE-INSPECT-SESSION'
          & $exe --inspect test.iso
          if ($LASTEXITCODE -ne 2 -or
              (Select-String -Path build/Release/Rayman2Fix_inspect.log -SimpleMatch 'STALE-INSPECT-SESSION') -or
              @(Select-String -Path build/Release/Rayman2Fix_inspect.log -Pattern '^Rayman2Fix INSPECT v1$').Count -ne 1 -or
              @(Select-String -Path build/Release/Rayman2Fix_inspect.log -Pattern '^INSPECT_RESULT=FAILED$').Count -ne 1) {
            throw 'Inspect report must contain only the latest inspection'
          }
          & $exe -h
          if ($LASTEXITCODE -ne 0) { throw '-h must show help' }
          & $exe --extract test.iso
          if ($LASTEXITCODE -ne 2) { throw 'Legacy --extract must be refused' }
          & $exe --install-only --verbose
          if ($LASTEXITCODE -ne 2) { throw 'No-disc --install-only must refuse safely' }
          if (!(Select-String -Path build/Release/Rayman2Fix_installer.log -Pattern 'INSTALL-ONLY|COMMAND: name=--install-only')) {
            throw '--install-only --verbose was not parsed'
          }
          # The unchecked command must never create a game directory, INI or
          # embedded DLL merely to attempt CreateProcessW.
          New-Item -Path direct-cli-smoke -ItemType Directory -Force | Out-Null
          Copy-Item $exe direct-cli-smoke/Rayman2Fix.exe
          & ./direct-cli-smoke/Rayman2Fix.exe --launch-no-verify
          if ($LASTEXITCODE -ne 1 -or (Test-Path direct-cli-smoke/game)) {
            throw '--launch-no-verify must return the OS error without provisioning'
          }
          if (!(Select-String -Path direct-cli-smoke/Rayman2Fix_installer.log -Pattern 'LAUNCH-NO-VERIFY: direct CreateProcessW')) {
            throw '--launch-no-verify must log direct OS launch failure'
          }
          $global:LASTEXITCODE = 0
      - name: Stage single executable and verify embedded DLL deployment
        shell: pwsh
        run: |
          New-Item -Path package -ItemType Directory -Force | Out-Null
          Copy-Item build/Release/Rayman2Fix.exe package/Rayman2Fix.exe
          if (!(Test-Path package/Rayman2Fix.exe)) {
            throw 'Missing Rayman2Fix.exe in bootstrap package'
          }
          if ((Get-ChildItem package -Recurse -File).Count -ne 1) {
            throw 'The bootstrap archive must contain exactly one EXE'
          }
          # Exercise the standalone EXE without a pre-populated game or state folder.
          New-Item -Path package-smoke -ItemType Directory -Force | Out-Null
          Copy-Item package/Rayman2Fix.exe package-smoke/Rayman2Fix.exe
          & ./package-smoke/Rayman2Fix.exe
          if ($LASTEXITCODE -ne 2) { throw 'No-media bootstrap must fail safely' }
          if (!(Test-Path package-smoke/mods/textures) -or
              !(Test-Path package-smoke/third_party/gameframe) -or
              !(Test-Path package-smoke/docs/README.md) -or
              (Test-Path package-smoke/README.md)) {
            throw 'New clean directories or docs/README.md missing, or old root README created'
          }
          $doc = Get-Content package-smoke/docs/README.md -Raw -Encoding UTF8
          if (!$doc.Contains('Installation neuve uniquement') -or
              !$doc.Contains('state/')) {
            throw 'Embedded user guide missing clean-layout/receipt instructions'
          }
          if (Test-Path package-smoke/state) {
            throw 'No-CD bootstrap must not create state/ before verification'
          }
          if (!(Test-Path package-smoke/docs/build-info.txt) -or
              (Test-Path package-smoke/build-info.txt)) {
            throw 'Build identity must live under docs/ only'
          }
          if (!(Test-Path package-smoke/game/fix.dll) -or
              !(Test-Path package-smoke/Rayman2Fix.ini)) {
            throw 'Single EXE failed to create game/fix.dll and root INI'
          }
          $expected = (Get-FileHash build/Release/fix.dll -Algorithm SHA256).Hash
          $actual = (Get-FileHash package-smoke/game/fix.dll -Algorithm SHA256).Hash
          if ($expected -ne $actual) {
            throw 'Embedded DLL is not identical to build output'
          }
          if (!(Select-String -Path package-smoke/Rayman2Fix_installer.log -Pattern '^RUNTIME-DEPLOY: status=installed backups_removed=0 backup_created=0$')) {
            throw 'Expected runtime deployment log: installed backups_removed=0'
          }
          # A mismatched embedded runtime is authoritative: replace it without
          # retaining any old DLL, even if legacy backups remain from old builds.
          $runtimeDir = (Resolve-Path 'package-smoke/game').Path
          $runtime = Join-Path $runtimeDir 'fix.dll'
          $backup = Join-Path $runtimeDir 'fix.dll.bak'
          $priorBackup = Join-Path $runtimeDir 'fix.dll.bak.previous'
          [IO.File]::WriteAllText($runtime, 'outdated-runtime-A')
          [IO.File]::WriteAllText($backup, 'obsolete-backup-A')
          [IO.File]::WriteAllText($priorBackup, 'obsolete-rotation-A')
          & ./package-smoke/Rayman2Fix.exe
          if ($LASTEXITCODE -ne 2 -or
              (Get-FileHash $runtime -Algorithm SHA256).Hash -ne $expected -or
              (Test-Path $backup) -or (Test-Path $priorBackup) -or
              (Test-Path "$runtime.installing")) {
            throw 'Runtime replacement must discard old DLL and legacy backups'
          }
          if (!(Select-String -Path package-smoke/Rayman2Fix_installer.log -Pattern '^RUNTIME-DEPLOY: status=replaced backups_removed=2 backup_created=0$')) {
            throw 'Expected runtime deployment log: replaced backups_removed=2'
          }

          # Same-size tampering must also be replaced. Check read-only legacy
          # runtime handling, then ensure a third unchanged run is idempotent.
          $tampered = [IO.File]::ReadAllBytes($runtime)
          $tampered[0] = $tampered[0] -bxor 0xFF
          [IO.File]::WriteAllBytes($runtime, $tampered)
          [IO.File]::SetAttributes($runtime, [IO.FileAttributes]::ReadOnly)
          & ./package-smoke/Rayman2Fix.exe
          if ($LASTEXITCODE -ne 2 -or
              (Get-FileHash $runtime -Algorithm SHA256).Hash -ne $expected -or
              @(Get-ChildItem $runtimeDir -File -Filter 'fix.dll.bak*').Count -ne 0 -or
              (Test-Path "$runtime.installing")) {
            throw 'Read-only same-size unknown runtime must be replaced without backup'
          }
          if (!(Select-String -Path package-smoke/Rayman2Fix_installer.log -Pattern '^RUNTIME-DEPLOY: status=replaced backups_removed=0 backup_created=0$')) {
            throw 'Expected runtime deployment log: replaced backups_removed=0'
          }
          $timestamp = (Get-Item $runtime).LastWriteTimeUtc.Ticks
          & ./package-smoke/Rayman2Fix.exe
          if ($LASTEXITCODE -ne 2 -or
              (Get-FileHash $runtime -Algorithm SHA256).Hash -ne $expected -or
              (Get-Item $runtime).LastWriteTimeUtc.Ticks -ne $timestamp -or
              @(Get-ChildItem $runtimeDir -File -Filter 'fix.dll.bak*').Count -ne 0) {
            throw 'Unchanged runtime must not be rewritten or generate backups'
          }
          if (!(Select-String -Path package-smoke/Rayman2Fix_installer.log -Pattern '^RUNTIME-DEPLOY: status=unchanged backups_removed=0 backup_created=0$')) {
            throw 'Expected runtime deployment log: unchanged backups_removed=0'
          }
          Write-Host 'Single authoritative game/fix.dll replacement, no backup: PASS'
          if (!(Test-Path package-smoke/third_party/gameframe/glide2x.dll) -or
              !(Test-Path package-smoke/docs/GameFrame-LICENSE-APACHE.txt) -or
              (Test-Path package-smoke/third_party/gameframe/GameFrame-LICENSE-APACHE.txt)) {
            throw 'Single EXE failed to unpack GameFrame Glide or Apache license'
          }
          $glide = (Get-FileHash package-smoke/third_party/gameframe/glide2x.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($glide -cne $env:RAYMAN2FIX_GAMEFRAME_SHA256) {
            throw "GameFrame embedded payload SHA256 mismatch: $glide"
          }
          $sourceLicense = (Get-FileHash third_party/game-frame/LICENSE-APACHE -Algorithm SHA256).Hash
          $localLicense = (Get-FileHash package-smoke/docs/GameFrame-LICENSE-APACHE.txt -Algorithm SHA256).Hash
          if ($sourceLicense -ne $localLicense) {
            throw 'Embedded Apache 2.0 license is not from pinned GameFrame source'
          }
          Write-Host "Standalone EXE deploys pinned x86 GameFrame: $glide"
          # Existing, unknown Glide DLL must be backed up, not lost, while
          # the pinned GameFrame DLL is reinstalled from the same EXE.
          [IO.File]::WriteAllText(
            (Resolve-Path 'package-smoke/third_party/gameframe/glide2x.dll'),
            'unknown-legacy-glide', [Text.Encoding]::ASCII)
          & ./package-smoke/Rayman2Fix.exe
          if ($LASTEXITCODE -ne 2) { throw 'Existing Glide upgrade failed unexpectedly' }
          $backup = 'package-smoke/third_party/gameframe/glide2x.dll.bak'
          if (!(Test-Path $backup) -or
              (Get-Content -Raw $backup) -ne 'unknown-legacy-glide') {
            throw 'Unknown old Glide DLL must be preserved under .bak'
          }
          $replacement = (Get-FileHash package-smoke/third_party/gameframe/glide2x.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($replacement -cne $glide) {
            throw 'GameFrame Glide replacement did not match the bundled SHA256'
          }
          # Repeated replacement rotates one managed backup (no migration).
          $glideDest = 'package-smoke/third_party/gameframe/glide2x.dll'
          [IO.File]::WriteAllText(
            (Resolve-Path $glideDest), 'second-unknown-glide', [Text.Encoding]::ASCII)
          & ./package-smoke/Rayman2Fix.exe
          if ($LASTEXITCODE -ne 2 -or
              (Get-Content -Raw $backup) -ne 'second-unknown-glide' -or
              (Get-FileHash $glideDest -Algorithm SHA256).Hash.ToLowerInvariant() -cne $glide) {
            throw 'GameFrame replacement must rotate one backup'
          }
          & ./package-smoke/Rayman2Fix.exe
          if ($LASTEXITCODE -ne 2 -or
              (Get-Content -Raw $backup) -ne 'second-unknown-glide') {
            throw 'Verified GameFrame must preserve its previous backup'
          }
          Remove-Item package-smoke -Recurse -Force
          if (Get-ChildItem -Path package -Recurse -File -Include Rayman2Fix.ini,Rayman2Fix.log,Rayman2Fix_installer.log,fix.dll,glide2x.dll) {
            throw 'One-file build must never include generated INI, logs or DLL sidecars'
          }
          $global:LASTEXITCODE = 0
      - name: Upload bootstrap package
        uses: actions/upload-artifact@v4
        with:
          name: Rayman2Fix-Windows-x86-bootstrap
          path: package/
          if-no-files-found: error
          retention-days: 30
      - name: Verify standard x86 runtime has no audio research hooks
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          binary=Path('build/Release/fix.dll').read_bytes()
          if b'RUNTIME-AUDIO-TRACE: enabled=1' in binary:
              raise SystemExit('Normal DLL unexpectedly contains experimental audio tracer')
          if b'RUNTIME-LEARN10-PROTOTYPE: enabled=1' in binary:
              raise SystemExit('Normal DLL unexpectedly contains experimental Learn10 memory-write feature')
          print('Standard DLL excludes audio and Learn10 experimental hooks: PASS')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Standard DLL included research probes' }
      - name: Build separate research-only audio trace launcher
        shell: pwsh
        run: |
          # Reuse the pinned already-built GameFrame resources. No original
          # Rayman 2 executable, ISO, soundtrack or private patch in artifacts.
          cmake -S . -B build -A Win32 -DBUILD_TESTING=OFF -DRAYMAN2FIX_AUDIO_TRACE=ON
          if ($LASTEXITCODE -ne 0) { throw 'Audio trace CMake configure failed' }
          cmake --build build --config Release --target Rayman2Fix --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Audio trace Windows x86 build failed' }
          @'
          from pathlib import Path
          binary=Path('build/Release/fix.dll').read_bytes()
          if b'RUNTIME-AUDIO-TRACE: enabled=1' not in binary:
              raise SystemExit('Research DLL missing distinctive audio trace marker')
          print('Research DLL includes audio tracer: PASS')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Audio research instrumentation not linked' }
          New-Item -Path audio-trace -ItemType Directory -Force | Out-Null
          Copy-Item build/Release/Rayman2Fix.exe audio-trace/Rayman2Fix.exe
          if (!(Test-Path audio-trace/Rayman2Fix.exe)) { throw 'Audio trace launcher not produced' }
          $global:LASTEXITCODE = 0
      - name: Verify the research EXE deploys the exact corrected DLL
        shell: pwsh
        run: |
          # Checking the DLL on disk before packaging is not enough:
          # Rayman2Fix.exe must embed THAT DLL and install it at launch.
          New-Item -ItemType Directory -Path research-package-smoke -Force | Out-Null
          Copy-Item audio-trace/Rayman2Fix.exe research-package-smoke/Rayman2Fix.exe
          & ./research-package-smoke/Rayman2Fix.exe --verify 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 2) {
            throw 'No-media research launcher did not refuse missing installation as expected'
          }
          $deployed = 'research-package-smoke/game/fix.dll'
          if (!(Test-Path $deployed)) {
            throw 'Research launcher did not deploy its embedded DLL'
          }
          $builtHash = (Get-FileHash build/Release/fix.dll -Algorithm SHA256).Hash
          $embeddedHash = (Get-FileHash $deployed -Algorithm SHA256).Hash
          if ($embeddedHash -ne $builtHash) {
            throw 'STALE EMBEDDED DLL: research launcher differs from compiled runtime'
          }
          @'
          from pathlib import Path
          data=Path('research-package-smoke/game/fix.dll').read_bytes()
          for marker in (
              b'RUNTIME-AUDIO-TRACE: enabled=1 schema=2 inner_record_ref=checked-pointer',
              b'sequence_ref_class=%u',
              b'inner_ref_class=%u',
          ):
              if marker not in data:
                  raise SystemExit(f'Research DLL missing corrected trace field: {marker!r}')
          print('Embedded research DLL exact-match and schema 2: PASS')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Embedded corrected audio trace marker check failed' }
          $global:LASTEXITCODE = 0
      - name: Upload optional sound-pause research build
        uses: actions/upload-artifact@v4
        with:
          name: Rayman2Fix-Windows-x86-audio-trace
          path: audio-trace/
          if-no-files-found: error
          retention-days: 30

      - name: Build separately gated ESC music Wine prototype
        shell: pwsh
        run: |
          # This is not a user-facing release. The output contains only our
          # launcher, its injected research DLL and the pinned GameFrame.
          # RAYMAN2FIX_ESC_AUDIO_PROTOTYPE=1 must ALSO be set at runtime.
          cmake -S . -B build -A Win32 -DBUILD_TESTING=OFF -DRAYMAN2FIX_AUDIO_TRACE=ON -DRAYMAN2FIX_ESC_MUSIC_PROTO=ON
          if ($LASTEXITCODE -ne 0) { throw 'ESC experiment CMake configure failed' }
          cmake --build build --config Release --target Rayman2Fix --parallel
          if ($LASTEXITCODE -ne 0) { throw 'ESC experiment Windows x86 build failed' }
          @'
          from pathlib import Path
          data=Path('build/Release/fix.dll').read_bytes()
          for marker in (
              b'RUNTIME-ESC-PROTOTYPE: enabled=1',
              b'source-hooks-installed',
              b'RUNTIME-AUDIO-TRACE: enabled=1',
          ):
              if marker not in data:
                  raise SystemExit(f'ESC prototype DLL missing marker {marker!r}')
          print('Opt-in native ESC prototype DLL linked: PASS')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'ESC experiment was not linked' }
          New-Item -Path esc-prototype -ItemType Directory -Force | Out-Null
          Copy-Item build/Release/Rayman2Fix.exe esc-prototype/Rayman2Fix.exe
          $global:LASTEXITCODE = 0
      - name: Verify ESC prototype EXE contains the exact new injected DLL
        shell: pwsh
        run: |
          New-Item -Path esc-prototype-smoke -ItemType Directory -Force | Out-Null
          Copy-Item esc-prototype/Rayman2Fix.exe esc-prototype-smoke/Rayman2Fix.exe
          & ./esc-prototype-smoke/Rayman2Fix.exe --verify 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 2) { throw 'Prototype did not fail safely without media' }
          $deployed = 'esc-prototype-smoke/game/fix.dll'
          if (!(Test-Path $deployed)) { throw 'Embedded prototype DLL not deployed' }
          $expected=(Get-FileHash build/Release/fix.dll -Algorithm SHA256).Hash
          $actual=(Get-FileHash $deployed -Algorithm SHA256).Hash
          if ($expected -ne $actual) { throw 'Stale embedded prototype DLL' }
          @'
          from pathlib import Path
          data=Path('esc-prototype-smoke/game/fix.dll').read_bytes()
          if b'RUNTIME-ESC-PROTOTYPE: enabled=1' not in data:
              raise SystemExit('Embedded DLL lacks opted-in prototype marker')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Prototype DLL marker missing after deployment' }
          $global:LASTEXITCODE = 0
      - name: Upload opt-in experimental ESC music launcher
        uses: actions/upload-artifact@v4
        with:
          name: Rayman2Fix-Windows-x86-esc-music-prototype
          path: esc-prototype/
          if-no-files-found: error
          retention-days: 14

      - name: Build dedicated Learn_10 read-only script research launcher
        shell: pwsh
        run: |
          # Reuse the already pinned GameFrame DLL. This research build
          # observes native script structure/state and NEVER changes AI,
          # story bits, input, cinematic transitions or game assets.
          # Explicitly turn OFF all other research audio/ESC variants.
          cmake -S . -B build -A Win32 -DBUILD_TESTING=OFF -DRAYMAN2FIX_RESEARCH_PROBES=ON -DRAYMAN2FIX_AUDIO_TRACE=OFF -DRAYMAN2FIX_ESC_MUSIC_PROTO=OFF
          if ($LASTEXITCODE -ne 0) { throw 'Learn10 research CMake configure failed' }
          cmake --build build --config Release --target Rayman2Fix --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Learn10 research Windows x86 build failed' }
          @'
          from pathlib import Path
          data=Path('build/Release/fix.dll').read_bytes()
          for marker in (
              b'RUNTIME-CONFIG: research_probes=1',
              b'RUNTIME-INTRO: native-phase-branches early104_count=',
              b'RUNTIME-INTRO: native-early-exit-shape',
          ):
              if marker not in data:
                  raise SystemExit(f'Learn10 research DLL missing read-only marker {marker!r}')
          if b'RUNTIME-AUDIO-TRACE: enabled=1' in data:
              raise SystemExit('Learn10 build unexpectedly includes audio tracer')
          print('Learn10 read-only native script probes linked: PASS')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Learn10 probe DLL fingerprint failed' }
